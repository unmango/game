syntax = "proto3";

package dev.unmango.game.v1alpha1;

import "dev/unmango/game/v1alpha1/curve.proto";
import "dev/unmango/game/v1alpha1/number.proto";
import "google/protobuf/duration.proto";

// CalculatorService answers numeric questions as pure functions of the
// server's root seed and the request.
service CalculatorService {
  // Derive returns the sub-seed for a path under the root seed.
  rpc Derive(DeriveRequest) returns (DeriveResponse);
  // Evaluate returns the value of a curve at a position.
  rpc Evaluate(EvaluateRequest) returns (EvaluateResponse);
  // Cumulative returns the total of a curve over positions from <= i < to.
  rpc Cumulative(CumulativeRequest) returns (CumulativeResponse);
  // Invert returns how many positions from a start a budget can cover.
  rpc Invert(InvertRequest) returns (InvertResponse);
  // Advance returns the progress a rate curve produces over a duration.
  rpc Advance(AdvanceRequest) returns (AdvanceResponse);
}

message DeriveRequest {
  string path = 1;
}

message DeriveResponse {
  uint64 seed = 1;
}

message EvaluateRequest {
  Curve curve = 1;
  int64 n = 2;
}

message EvaluateResponse {
  Number value = 1;
}

message CumulativeRequest {
  Curve curve = 1;
  int64 from = 2;
  int64 to = 3;
}

message CumulativeResponse {
  Number value = 1;
}

message InvertRequest {
  Curve curve = 1;
  int64 from = 2;
  Number budget = 3;
}

message InvertResponse {
  int64 count = 1;
}

message AdvanceRequest {
  Curve rate = 1;
  int64 level = 2;
  google.protobuf.Duration elapsed = 3;
}

message AdvanceResponse {
  Number value = 1;
}
